# Local development / self-hosting stack.
#
#   docker compose up -d db            # just PostgreSQL (run the app with `npm run dev`)
#   docker compose up --build          # PostgreSQL + migrations + the app on http://localhost:3000
#   docker compose run --rm migrate npx prisma db seed     # optional demo data
#
# Values come from `.env` (copy .env.example). The defaults below are for local use only – change every
# secret before exposing this anywhere.

name: gst-recon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gstrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gstrecon}
      POSTGRES_DB: ${POSTGRES_DB:-gstrecon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gstrecon} -d $${POSTGRES_DB:-gstrecon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply Prisma migrations, then exit. `docker compose up` runs it before the app starts.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gstrecon}:${POSTGRES_PASSWORD:-gstrecon}@db:5432/${POSTGRES_DB:-gstrecon}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-gstrecon}:${POSTGRES_PASSWORD:-gstrecon}@db:5432/${POSTGRES_DB:-gstrecon}?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gstrecon}:${POSTGRES_PASSWORD:-gstrecon}@db:5432/${POSTGRES_DB:-gstrecon}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-gstrecon}:${POSTGRES_PASSWORD:-gstrecon}@db:5432/${POSTGRES_DB:-gstrecon}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      CRON_SECRET: ${CRON_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REDIRECT_URI: ${ZOHO_REDIRECT_URI:-http://localhost:3000/api/zoho/callback}
      ZOHO_DC: ${ZOHO_DC:-in}
      GSP_PROVIDER: ${GSP_PROVIDER:-none}
      GSP_HTTP_NAME: ${GSP_HTTP_NAME:-}
      GSP_HTTP_BASE_URL: ${GSP_HTTP_BASE_URL:-}
      GSP_HTTP_PATH: ${GSP_HTTP_PATH:-}
      GSP_HTTP_API_KEY: ${GSP_HTTP_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4}
      MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-20000}

volumes:
  pgdata:
